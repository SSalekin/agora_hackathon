[toolchain]
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.localnet]
escrow = "9nWcd1EWhogJsBtk1Q43GP9eVvn6K9TgaSG5JyhnTp6X"

[programs.devnet]
escrow = "9nWcd1EWhogJsBtk1Q43GP9eVvn6K9TgaSG5JyhnTp6X"

# [registry] section removed — no longer used in Anchor 1.0

[provider]
cluster = "Devnet"
