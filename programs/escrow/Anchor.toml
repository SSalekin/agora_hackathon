[scripts]
test = "cd ../.. && pnpm exec ts-mocha -p programs/escrow/tsconfig.json -t 1000000 programs/escrow/tests/bankrun.test.ts"
"test:devnet" = "cd ../.. && pnpm exec ts-mocha -p programs/escrow/tsconfig.json -t 120000 programs/escrow/tests/devnet-e2e.ts"
